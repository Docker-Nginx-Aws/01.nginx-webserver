# ============================================================
# GitHub Actions CI/CD Pipeline
# Triggers on: push to main branch
# Pipeline:
#   1. Build Docker image
#   2. Push to Docker Hub
#   3. SSH into EC2 and deploy new container
# ============================================================

name: Build, Push and Deploy Nginx Web Server

on:
  push:
    branches:
      - main           # Trigger only on push to main
  pull_request:
    branches:
      - main           # Also run on PR to main (but don't deploy)

env:
  # Docker Hub image name: yourdockerid/nginx-webserver
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nginx-webserver
  CONTAINER_NAME: nginx-webserver
  NGINX_PORT: 80

jobs:

  # ─────────────────────────────────────────────────────────
  # JOB 1: BUILD AND PUSH DOCKER IMAGE TO DOCKER HUB
  # ─────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest      # GitHub-hosted runner (Ubuntu 22.04)

    # Only build on actual push to main, not on PRs
    # (PRs will trigger but we skip the deploy step)
    steps:

      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      # Buildx is the modern Docker build toolkit with caching support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Docker Hub
      # Credentials stored as GitHub Secrets (never hardcode them)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Extract metadata (tags, labels) for Docker image
      # This auto-generates tags like: latest, main, sha-abc1234
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ github.run_number }}

      # Step 5: Build Docker image and push to Docker Hub
      # --cache-from: use cached layers from previous builds (faster CI)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}   # Only push on push event, not PR
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha                        # Use GitHub Actions cache
          cache-to: type=gha,mode=max

      # Step 6: Print image digest for traceability
      - name: Print Image Digest
        run: echo "Docker image pushed with digest ${{ steps.build-push.outputs.digest }}"

  # ─────────────────────────────────────────────────────────
  # JOB 2: DEPLOY TO AWS EC2
  # Only runs after build-and-push succeeds
  # Only runs on push to main (not on PRs)
  # ─────────────────────────────────────────────────────────
  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push           # Wait for build job to complete
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # Step 1: Checkout (needed for any file references)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: SSH into EC2 and run deploy commands
      # EC2_SSH_PRIVATE_KEY: the .pem file content stored as GitHub Secret
      # EC2_HOST: public IP or DNS of your EC2 instance
      # EC2_USER: ec2-user (Amazon Linux 2023)
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          script: |
            # ── Pull the latest image from Docker Hub ──
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nginx-webserver:latest

            # ── Stop and remove the existing container (if running) ──
            docker stop nginx-webserver || true
            docker remove nginx-webserver || true

            # ── Run the new container ──
            docker run -d \
              --name nginx-webserver \
              --restart unless-stopped \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/nginx-webserver:latest

            # ── Verify the container is running ──
            docker ps | grep nginx-webserver

            # ── Test Nginx responds ──
            sleep 5
            curl -f http://localhost/ || exit 1

            # ── Clean up old/dangling images to save disk space ──
            docker image prune -f

            echo "Deployment successful!"

      # Step 3: Notify deployment status
      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment to EC2 SUCCEEDED"
            echo "🌐 Site URL: http://${{ secrets.EC2_HOST }}"
          else
            echo "❌ Deployment to EC2 FAILED"
          fi