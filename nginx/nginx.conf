# ============================================================
# nginx.conf - Custom Nginx Configuration
# Optimized for serving static files (HTML, CSS, JS, images, PDFs)
# ============================================================

# user: nginx process runs as 'nginx' user (security best practice)
# Never run Nginx as root!
user  nginx;

# worker_processes auto: automatically sets to number of CPU cores
# On a t2.micro (1 vCPU), this = 1 worker
worker_processes  auto;

# Error log location and level
# Levels: debug | info | notice | warn | error | crit | alert | emerg
error_log  /var/log/nginx/error.log warn;

# PID file stores the master process ID
pid        /var/run/nginx.pid;


# ── EVENTS BLOCK ────────────────────────────────────────────
events {
    # Maximum simultaneous connections per worker process
    # t2.micro is small so 1024 is appropriate
    worker_connections  1024;

    # Accept all connections at once (more efficient under high load)
    multi_accept on;

    # epoll is the most efficient event method on Linux
    use epoll;
}


# ── HTTP BLOCK ───────────────────────────────────────────────
http {

    # ── MIME Types ──────────────────────────────────────────
    # Include the default MIME types mapping file
    # This maps file extensions to Content-Type headers
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;  # Fallback for unknown types


    # ── Logging ─────────────────────────────────────────────
    # Define log format
    # $remote_addr: client IP
    # $request: "GET /index.html HTTP/1.1"
    # $status: 200, 404, etc.
    # $body_bytes_sent: bytes sent (excluding headers)
    # $http_referer: where they came from
    # $http_user_agent: browser/client string
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;


    # ── Performance Settings ─────────────────────────────────

    # sendfile: use kernel's sendfile() syscall for file transfers
    # More efficient than read() + write() - skips user space
    sendfile        on;

    # tcp_nopush: send HTTP headers and file content in same TCP packet
    # Works only when sendfile is on
    tcp_nopush     on;

    # tcp_nodelay: disable Nagle's algorithm for latency-sensitive connections
    tcp_nodelay    on;

    # keepalive_timeout: how long to keep a TCP connection open
    # 65 seconds allows browser to reuse connection for multiple assets
    keepalive_timeout  65;

    # client_max_body_size: max size of client request body
    # We don't accept file uploads, but PDFs in request? 10MB is generous
    client_max_body_size 10m;


    # ── Compression (gzip) ───────────────────────────────────
    # Compress text responses before sending to client
    # Reduces bandwidth usage by 60-80% for text files
    gzip  on;
    gzip_vary on;             # Add Vary: Accept-Encoding header
    gzip_proxied any;
    gzip_comp_level 6;        # Compression level 1-9 (6 is good balance)
    gzip_min_length 256;      # Only compress files > 256 bytes
    gzip_types
        text/plain
        text/html
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # Note: Don't gzip images (jpeg, png) - they're already compressed


    # ── Security Headers ─────────────────────────────────────
    # These headers protect against common web attacks
    add_header X-Frame-Options "SAMEORIGIN" always;         # Prevent clickjacking
    add_header X-Content-Type-Options "nosniff" always;     # Prevent MIME sniffing
    add_header X-XSS-Protection "1; mode=block" always;     # XSS filter (legacy)
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Hide Nginx version number in error pages and Server header
    # Attackers can't exploit version-specific vulnerabilities if they don't know the version
    server_tokens off;


    # ── SERVER BLOCK (Virtual Host) ─────────────────────────
    # This is like Apache's <VirtualHost *:80>
    server {

        # Listen on port 80 for IPv4
        listen       80;

        # Listen on port 80 for IPv6
        listen  [::]:80;

        # Server name (domain or IP)
        # _ is a catch-all (matches any hostname/IP)
        server_name  _;

        # Web root: where Nginx looks for files
        root   /usr/share/nginx/html;

        # Default file to serve when a directory is requested
        index  index.html index.htm;

        # Charset
        charset utf-8;


        # ── LOCATION BLOCKS ──────────────────────────────────


        # Root location - serves index.html for /
        location / {
            # try_files: try these in order:
            # $uri       → exact file match (/about.html → about.html)
            # $uri/      → directory with index.html
            # =404       → return 404 if neither found
            try_files $uri $uri/ =404;
        }


        # Serve CSS files with long cache
        location /css/ {
            try_files $uri =404;
            # Cache CSS for 30 days - browser won't re-request
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }


        # Serve JavaScript files with long cache
        location /js/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }


        # Serve image files with long cache
        location /images/ {
            try_files $uri =404;
            # Images rarely change - cache for 90 days
            expires 90d;
            add_header Cache-Control "public, no-transform";
        }


        # Serve PDF and document files
        location /docs/ {
            try_files $uri =404;
            # Add Content-Disposition header so PDFs open in browser
            # Use "attachment" instead of "inline" to force download
            add_header Content-Disposition "inline";
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }


        # Favicon - short cache, suppress 404 logs for missing favicon
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            expires 1d;
        }


        # robots.txt - serve silently
        location = /robots.txt {
            log_not_found off;
            access_log off;
        }


        # Custom error pages
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;   # Only accessible via internal redirects, not directly
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}